    <meta name="description" content="Official Corporate Disclosures, Investor Relations, WHO-GMP Parenteral Manufacturing and Statutory Filings Portal of Beryl Drugs Limited (BSE: 524680)." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Early suppression of third-party browser extension errors (e.g. MetaMask, Phantom, Web3 wallets in sandboxed preview iframes)
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          var text = typeof msg === 'string' ? msg : (msg.message || msg.toString() || '');
          text = text.toLowerCase();
          return (
            text.indexOf('metamask') !== -1 ||
            text.indexOf('ethereum') !== -1 ||
            text.indexOf('web3') !== -1 ||
            text.indexOf('chrome-extension') !== -1 ||
            text.indexOf('failed to connect') !== -1 ||
            text.indexOf('wallet') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message || event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
